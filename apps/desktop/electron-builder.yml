appId: com.screentools.desktop
productName: ScreenTools
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: ../../release
  # 应用图标（build/icon.ico、build/icon.icns、build/icon.png）由
  # scripts/generate-icons.mjs 生成，electron-builder 会自动识别。
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**
# Koffi 使用预编译 Node-API 二进制，不在用户机器上调用 C++ 编译器。
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  # 无开发者证书的测试包使用 ad-hoc 签名，不进行 Apple 公证。
  identity: '-'
  hardenedRuntime: false
  notarize: false
publish: null
