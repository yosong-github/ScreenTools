name: Release Build

on:
  # 由 Release Please 工作流在创建 Release 后调用。
  workflow_call:
    inputs:
      tag:
        description: 要构建并上传的 Release 标签，例如 v0.2.0
        required: true
        type: string
  # 需要重新构建某个已发布版本时手动运行。
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建并上传的 Release 标签，例如 v0.2.0
        required: true
        type: string

permissions:
  contents: write

env:
  HUSKY: '0'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 质量检查
        run: pnpm check
      - name: 构建 EXE（不自动发布）
        run: pnpm --filter @screentools/desktop exec electron-builder --win --x64 --publish never
      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" release/*.exe --clobber

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 质量检查
        run: pnpm check
      # 使用同架构 runner 安装 Koffi 二进制，避免跨架构缺失原生依赖。
      - name: 构建 DMG 和 ZIP（不自动发布）
        run: pnpm --filter @screentools/desktop exec electron-builder --mac --${{ matrix.arch }} --publish never
      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" release/*.dmg release/*.zip --clobber
