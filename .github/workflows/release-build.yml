name: Release Build

on:
  # 由 Release Please 工作流在创建 Release 后调用。
  workflow_call:
    inputs:
      tag:
        description: 要构建并上传的 Release 标签，例如 v0.2.0
        required: true
        type: string
  # 需要重新构建某个已发布版本时手动运行；标签留空则使用最新 Release。
  workflow_dispatch:
    inputs:
      tag:
        description: Release 标签，例如 v0.2.0；留空表示最新 Release
        required: false
        type: string

permissions:
  contents: write

env:
  HUSKY: '0'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 先确认标签真实存在，避免 checkout 抛出难以定位的 git 错误。
      - name: 解析并校验发布标签
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --json tagName -q .tagName)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::未提供发布标签，且仓库中没有可用的 Release"
            exit 1
          fi
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::error::标签 '$tag' 不存在，请填写完整标签（例如 v0.2.0），注意不要包含全角字符"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布标签：\`$tag\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 只构建、不在标签上跑 lint / 测试：标签是不可变的，用今天的检查规则去校验
      # 历史版本会把旧版本的重建卡死（例如 v0.2.0 的 CHANGELOG 尚未加入 prettier 忽略）。
      - name: 构建 Windows 安装包
        run: pnpm --filter @screentools/desktop build:win
      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" release/*.exe --clobber
